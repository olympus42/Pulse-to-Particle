name: Deploy to GitHub Pages

# Publishes the static site (index.html + assets) to GitHub Pages on every
# push to main. Enable it once under Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the whole repo is the site — it's a single static file plus assets
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
